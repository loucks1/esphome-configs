esphome:
  includes:
    !include https://raw.githubusercontent.com/loucks1/esphome-configs/main/dooropened.c

i2s_audio:
  - id: i2s_bus
    i2s_lrclk_pin: GPIO26
    i2s_bclk_pin: GPIO27
speaker:
  - platform: i2s_audio
    id: my_speaker
    i2s_audio_id: i2s_bus
    dac_type: external
    i2s_dout_pin: GPIO25
    channel: mono
media_player:
  - platform: speaker
    name: "ESPHome I2S Media Player"
    announcement_pipeline:
      speaker: my_speaker
      format: WAV          
      sample_rate: 16000   
      num_channels: 1
    buffer_size: 32000     
    codec_support_enabled: NONE   
