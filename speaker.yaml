audio_file:
  - id: dooropened_sound
    file:
      type: web
      url: "https://github.com/loucks1/esphome-configs/raw/refs/heads/main/dooropened.wav"

i2s_audio:
  - id: i2s_bus
    i2s_lrclk_pin: GPIO26
    i2s_bclk_pin: GPIO27
speaker:
  - platform: i2s_audio
    id: my_speaker
    i2s_audio_id: i2s_bus
    dac_type: external
    i2s_dout_pin: GPIO25
    channel: mono
media_player:
  - platform: speaker
    id: my_media_player
    name: "ESPHome I2S Media Player"
    announcement_pipeline:
      speaker: my_speaker
      format: WAV          
      sample_rate: 16000   
      num_channels: 1
    buffer_size: 32000     
    codec_support_enabled: NONE   

button:    
  - platform: template
    name: "Play Door Opened Sound"
    id: play_door_sound_button
    icon: "mdi:door-open"
    on_press:
      then:
        - media_player.speaker.play_on_device_media_file:
            id: my_media_player          # Must match your media_player ID
            media_file: dooropened_sound
            announcement: true           # Recommended for on-device files