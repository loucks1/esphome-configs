audio_file:
  - id: dooropened_sound
    file:
      type: web
      url: "https://github.com/loucks1/esphome-configs/raw/refs/heads/main/dooropened.wav"

i2s_audio:
  - id: i2s_bus
    i2s_lrclk_pin: GPIO26
    i2s_bclk_pin: GPIO27
speaker:
  - platform: i2s_audio
    id: my_speaker
    i2s_audio_id: i2s_bus
    dac_type: external
    i2s_dout_pin: GPIO25
    channel: mono
media_player:
  # The speaker media player has no restore_mode key. setup() loads the saved
  # volume and mute from flash (volume_initial, default 50%, is only the
  # first-boot fallback) and then forces playback to idle. A reboot does not
  # resume audio or replay the door sound, and it does not transmit RF.
  - platform: speaker
    id: my_media_player
    name: "ESPHome I2S Media Player"
    announcement_pipeline:
      speaker: my_speaker
      format: WAV   
      sample_rate: 16000
      num_channels: 1
    buffer_size: 32000
    
button:
  # Template buttons are stateless. There is no restore_mode. on_press runs
  # only when the button is pressed, never from boot restore.
  # The I2S bus, the i2s_audio speaker, and the door-opened audio file have no
  # user-facing state to persist.
  - platform: template
    name: "Play Door Opened Sound"
    id: play_door_sound_button
    icon: "mdi:door-open"
    on_press:
      then:
        - media_player.volume_set: 95%    
        - delay: 1ms    
        - media_player.speaker.play_on_device_media_file:
            id: my_media_player          
            media_file: dooropened_sound
            announcement: true       
