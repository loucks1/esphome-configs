remote_transmitter:
  pin: GPIO14
  # RF uses a 100% carrier signal
  carrier_duty_percent: 100%
  non_blocking: true

globals:
  - id: left_closed_issued
    type: bool
    initial_value: "false"
  - id: right_closed_issued
    type: bool
    initial_value: "false"
  - id: saved_fan_speed
    type: int

cover:
  - platform: template
    name: "Deck Blinds"
    id: deck_blinds
    open_action: 
      then:
        - cover.open: deck_blind_right
        - cover.open: deck_blind_left
    close_action: 
      then:
        - cover.close: deck_blind_right
        - cover.close: deck_blind_left
    stop_action: 
      then:
        - cover.stop: deck_blind_right
        - cover.stop: deck_blind_left
    assumed_state: True

  - platform: time_based
    id: deck_blind_left
    name: Deck Blind Left
    open_duration: 50s
    close_duration: 50s
    has_built_in_endstop: True
    manual_control: True
    open_action:
      then:
        - cover.open: deck_blind_left_tilt
        - delay: 2s
        - remote_transmitter.transmit_raw:
            code: [ 4882, -1590, 353, -722, 399, -718, 348, -727, 394, -724, 341, -731, 391, -730, 335, -736, 740, -386, 321, -745, 381, -744, 674, -386, 731, -400, 307, -749, 378, -758, 304, -751, 378, -761, 302, -753, 377, -761, 298, -759, 372, -766, 294, -758, 720, -421, 631, -410, 717, -424, 284, -762, 369, -773, 286, -763, 369, -772, 287, -761, 370, -772, 286, -763, 723, -420, 288, -757, 374, -768, 290, -758, 723, -416, 637, -402, 724, -416, 636, -410, 367 ]
            repeat:
              times: $deck_blind_retries
              wait_time: 10000us
        - globals.set: 
            id: left_closed_issued
            value: "false"
    close_action: 
      then:
        - cover.open: deck_blind_left_tilt
        - remote_transmitter.transmit_raw:
            code: [ 4909, -1572, 368, -731, 363, -729, 365, -734, 360, -731, 364, -731, 369, -725, 368, -730, 713, -376, 367, -731, 363, -728, 717, -376, 711, -381, 360, -737, 358, -713, 381, -737, 358, -737, 360, -738, 357, -733, 361, -738, 356, -735, 359, -738, 712, -375, 714, -379, 710, -379, 357, -740, 360, -730, 365, -733, 361, -731, 363, -734, 361, -730, 365, -733, 709, -386, 358, -740, 354, -735, 709, -386, 702, -383, 708, -385, 702, -384, 356, -742, 353 ]
            repeat:
              times: $deck_blind_retries
              wait_time: 10000us
    stop_action: 
      then:
        - remote_transmitter.transmit_raw:
            code: [ 4909, -1562, 376, -721, 370, -722, 374, -724, 367, -725, 371, -728, 363, -729, 368, -730, 714, -369, 376, -732, 359, -731, 714, -382, 701, -386, 356, -744, 347, -749, 349, -751, 339, -752, 349, -753, 337, -752, 347, -754, 335, -753, 345, -756, 688, -398, 693, -408, 674, -412, 330, -774, 315, -769, 336, -770, 319, -764, 336, -769, 321, -762, 338, -767, 668, -417, 331, -780, 656, -425, 321, -787, 651, -422, 326, -782, 657, -417, 329, -776, 667 ]
