remote_transmitter:
  pin: GPIO14
  # RF uses a 100% carrier signal
  carrier_duty_percent: 100%
  non_blocking: true

globals:
  - id: living_room_fan_boot_complete
    type: bool
    # Not persisted. Stays false while setup restores the fan, then on_boot sets it.
    restore_value: false
    initial_value: "false"

esphome:
  on_boot:
    # Template fan setup publishes the restored on/speed state and that publish
    # can run on_turn_on / on_speed_set. Those actions transmit. This flag is
    # set only after that publish, and the actions below no-op until then.
    # Restoring still updates the Home Assistant state. It does not key the remote.
    priority: -100
    then:
      - lambda: 'id(living_room_fan_boot_complete) = true;'

fan:
  - platform: template
    id: living_room_fan
    name: "Living Room Fan"
    # Last on/off and speed are restored. If nothing was saved, the fan stays off.
    # There is no plain RESTORE on the fan platform.
    restore_mode: RESTORE_DEFAULT_OFF
    speed_count: 3
    on_speed_set:
    - if:
        condition:
         lambda: return id(living_room_fan_boot_complete) && id(living_room_fan).state && x == 1;
        then:
          - remote_transmitter.transmit_rc_switch_raw:
              code: '000000110111' # action for speed 1 (code 55)
              protocol: 
                pulse_length: 10
                sync: [51, 37]
                zero: [45, 78]
                one: [86, 37]
                inverted: true
              repeat:
                times: 12
                wait_time: 20ms
    - if:
        condition:
         lambda: return id(living_room_fan_boot_complete) && id(living_room_fan).state && x == 2;
        then:
          - remote_transmitter.transmit_rc_switch_raw:
              code: '000000101111' # action for speed 2 (code 47)
              protocol: 
                pulse_length: 10
                sync: [51, 37]
                zero: [45, 78]
                one: [86, 37]
                inverted: true
              repeat:
                times: 12
                wait_time: 20ms
    - if:
        condition:
         lambda: return id(living_room_fan_boot_complete) && id(living_room_fan).state && x == 3;
        then:
          - remote_transmitter.transmit_rc_switch_raw:
              code: '000000011111' # action for speed 3 (code 31)
              protocol: 
                pulse_length: 10
                sync: [51, 37]
                zero: [45, 78]
                one: [86, 37]
                inverted: true
              repeat:
                times: 12
                wait_time: 20ms
    on_turn_on:
      then:
        - if:
            condition:
              lambda: 'return id(living_room_fan_boot_complete);'
            then:
              - lambda: |-
                  id(saved_fan_speed) = id(living_room_fan).speed;  // Save current speed
              - fan.turn_on:
                  id: living_room_fan
                  speed: 3
              - fan.turn_on:
                  id: living_room_fan
                  speed: 1
              - fan.turn_on:
                  id: living_room_fan
                  speed: !lambda return id(saved_fan_speed);
          
    on_turn_off:
      then:
        - if:
            condition:
              lambda: 'return id(living_room_fan_boot_complete);'
            then:
              - remote_transmitter.transmit_rc_switch_raw:
                  code: '000000111101' # action for off (code 61)
                  protocol: 
                    pulse_length: 10
                    sync: [51, 37]
                    zero: [45, 78]
                    one: [86, 37]
                    inverted: true
                  repeat:
                    times: 12
                    wait_time: 20ms
